name: Check volleyball registrations

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}

concurrency:
  group: volleyball-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python main.py
        env:
          SURREY_SEARCH_URL: ${{ vars.SURREY_SEARCH_URL }}
          LOOKAHEAD_DAYS: ${{ vars.LOOKAHEAD_DAYS }}
          NOTIFY_WINDOW_DAYS: ${{ vars.NOTIFY_WINDOW_DAYS }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_ID }}
          HALF_FULL_RATIO: ${{ vars.HALF_FULL_RATIO }}

      - name: Commit updated state
        run: |
          git config user.name "volleyball-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || git commit -m "Update state [skip ci]"
          git push
